<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>404 — Resource not found | Dinesh V</title>
<meta name="robots" content="noindex" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23080B12'/%3E%3Cpath d='M8 22V10h5a6 6 0 0 1 0 12H8Z' fill='none' stroke='%230078D4' stroke-width='2.4'/%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
:root{--bg:#080B12;--surface:#0F141D;--border:#252D3A;--text:#F5F7FA;--text-2:#9AA5B5;--azure:#0078D4;--err:#EF4444;--ok:#22C55E}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;
  display:grid;place-items:center;text-align:center;padding:24px;
  background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);background-size:52px 52px}
.mono{font-family:'JetBrains Mono',monospace}
h1{font-size:clamp(64px,16vw,132px);margin:0;letter-spacing:-.04em;font-weight:800}
p{color:var(--text-2);max-width:40ch}
.term{margin:22px auto;max-width:420px;background:var(--surface);border:1px solid var(--border);border-radius:12px;text-align:left;overflow:hidden}
.term .bar{padding:9px 14px;border-bottom:1px solid var(--border);font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--text-2);display:flex;gap:6px;align-items:center}
.term .bar i{width:9px;height:9px;border-radius:50%}
.term .bar i:nth-child(1){background:#ff5f57}.term .bar i:nth-child(2){background:#febc2e}.term .bar i:nth-child(3){background:#28c840}
.term .body{padding:14px;font-family:'JetBrains Mono',monospace;font-size:12.5px;line-height:1.8}
.term .cmd::before{content:"$ ";color:var(--ok)}
.term .err{color:var(--err)}
.btn{display:inline-flex;align-items:center;gap:8px;margin-top:8px;padding:12px 22px;border-radius:10px;background:var(--azure);color:#fff;font-weight:600;text-decoration:none;transition:.16s}
.btn:hover{filter:brightness(1.1);transform:translateY(-2px)}
</style>
</head>
<body>
<main>
  <h1>404</h1>
  <p>This route doesn't exist. The resource you asked for isn't in the cluster.</p>
  <div class="term">
    <div class="bar"><i></i><i></i><i></i>&nbsp;dinesh@portfolio</div>
    <div class="body">
      <div class="cmd">kubectl get route /unknown</div>
      <div class="err">Error: resource not found</div>
    </div>
  </div>
  <a class="btn" href="/">← Back home</a>
</main>
</body>
</html>
